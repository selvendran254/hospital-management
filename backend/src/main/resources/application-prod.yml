spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  storage:
    provider: ${APP_STORAGE_PROVIDER:s3}
    local:
      base-path: ${FILE_STORAGE_PATH:./uploads}
      base-url: ${FILE_STORAGE_URL:https://api.hospital.com/files}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:200}
  domain:
    api-base-url: ${APP_API_BASE_URL:https://api.hospital.com}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:https://hospital.com}
  integrations:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-sms: ${TWILIO_FROM_SMS:}
      from-whatsapp: ${TWILIO_FROM_WHATSAPP:}
    jitsi:
      base-url: ${JITSI_BASE_URL:https://meet.jit.si}
  backup:
    directory: ${DB_BACKUP_DIR:/var/backups/hospital}
    cron: ${DB_BACKUP_CRON:0 0 2 * * *}
  compliance:
    encryption-at-rest: ${COMPLIANCE_ENCRYPTION_AT_REST:true}
    encryption-in-transit: ${COMPLIANCE_ENCRYPTION_IN_TRANSIT:true}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:hospital}
